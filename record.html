<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳系統｜簡記理財</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" aria-label="主選單">
    <ul>
      <li><a href="index.html">首頁</a></li>
      <li><a href="record.html" aria-current="page">記帳系統</a></li>
      <li><a href="budget.html">預算管理系統</a></li>
      <li><a href="analysis.html">分析統計</a></li>
      <li class="nav-auth"><a href="login.html" id="auth-link">登入</a></li>
    </ul>
  </nav>

  <header class="hero page-title">
    <h1>記帳系統</h1>
  </header>

  <main>
    <form id="record-form" class="form form-admin" autocomplete="off" hidden>
      <h2 id="form-title">新增金額</h2>

      <div class="field">
        <label for="date">日期</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="name">名稱</label>
        <input type="text" id="name" required maxlength="50">
      </div>

      <div class="field">
        <label for="type">類型</label>
        <select id="type" required>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>

      <div class="field">
        <label for="amount">金額</label>
        <input type="number" id="amount" required min="0.01" step="0.01" inputmode="decimal">
      </div>

      <button type="submit" id="submit-btn" class="btn">新增</button>
      <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>取消修改</button>
      <p id="form-status" class="status" role="status"></p>
    </form>

    <p id="status" class="status" role="status">載入中…</p>

    <div id="table-wrap" class="table-wrap" hidden>
      <table class="records" aria-label="記帳記錄">
        <thead>
          <tr>
            <th scope="col">日期</th>
            <th scope="col">名稱</th>
            <th scope="col">類型</th>
            <th scope="col" class="num">金額</th>
            <th scope="col" id="actions-th" hidden>操作</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    // 請填入你的 Supabase Project URL 與 anon key（不要放 service_role key）
    const SUPABASE_URL = "https://pugvmbvzzmyrequecdzq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QtxxUQ6FXAftG3uLoHcKhA_JP1rJoMs";
    const SESSION_KEY = "sb_session";

    const statusEl = document.getElementById("status");
    const wrapEl = document.getElementById("table-wrap");
    const bodyEl = document.getElementById("records-body");
    const authLink = document.getElementById("auth-link");

    const TYPE_LABELS = { income: "收入", expense: "支出" };

    // ---------- 登入狀態 ----------
    function getSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY));
      } catch (e) {
        return null;
      }
    }

    function saveSession(data) {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: data.expires_at
        }));
      } catch (e) {}
    }

    function clearSession() {
      try {
        localStorage.removeItem(SESSION_KEY);
      } catch (e) {}
    }

    function goLogin() {
      clearSession();
      location.replace("login.html");
    }

    async function refreshSession(session) {
      try {
        const response = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ refresh_token: session.refresh_token })
        });
        if (!response.ok) {
          return null;
        }
        saveSession(await response.json());
        return getSession();
      } catch (e) {
        return null;
      }
    }

    // 取得有效的登入資訊；快過期時自動更新
    async function getValidSession() {
      let session = getSession();
      if (!session) {
        return null;
      }
      if (session.expires_at && session.expires_at * 1000 - Date.now() < 60000) {
        session = await refreshSession(session);
      }
      return session;
    }

    // ---------- 登出 ----------
    if (getSession()) {
      authLink.textContent = "登出";
      authLink.addEventListener("click", async function (event) {
        event.preventDefault();
        const session = getSession();
        try {
          await fetch(SUPABASE_URL + "/auth/v1/logout?scope=local", {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + session.access_token
            }
          });
        } catch (e) {}
        goLogin();
      });
    }

    // ---------- 管理者功能 ----------
    // 注意：這裡判斷管理者只是為了決定要不要顯示按鈕，
    // 真正的權限由資料庫的 RLS 規則把關。
    const formEl = document.getElementById("record-form");
    const formTitleEl = document.getElementById("form-title");
    const formStatusEl = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const actionsTh = document.getElementById("actions-th");
    const dateEl = document.getElementById("date");
    const nameEl = document.getElementById("name");
    const typeEl = document.getElementById("type");
    const amountEl = document.getElementById("amount");

    let isAdmin = false;
    let myId = null;
    let editingId = null;

    function decodeToken(token) {
      try {
        const part = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(atob(part));
      } catch (e) {
        return {};
      }
    }

    function todayString() {
      const d = new Date();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + month + "-" + day;
    }

    function setFormStatus(message, isError) {
      formStatusEl.textContent = message;
      formStatusEl.className = isError ? "status error" : "status";
    }

    function resetForm() {
      formEl.reset();
      dateEl.value = todayString();
      editingId = null;
      formTitleEl.textContent = "新增金額";
      submitBtn.textContent = "新增";
      cancelBtn.hidden = true;
    }

    function startEdit(row) {
      editingId = row.id;
      dateEl.value = row.record_date;
      nameEl.value = row.name;
      typeEl.value = row.type;
      amountEl.value = row.amount;
      formTitleEl.textContent = "修改記錄";
      submitBtn.textContent = "更新";
      cancelBtn.hidden = false;
      setFormStatus("", false);
      formEl.scrollIntoView({ behavior: "smooth", block: "start" });
      nameEl.focus();
    }

    // 呼叫資料表 API；回傳 { ok, status, data }
    async function callApi(method, query, body) {
      const session = await getValidSession();
      if (!session) {
        goLogin();
        return null;
      }

      const response = await fetch(SUPABASE_URL + "/rest/v1/records" + query, {
        method: method,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + session.access_token,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: body ? JSON.stringify(body) : undefined
      });

      if (response.status === 401) {
        goLogin();
        return null;
      }

      let data = null;
      try {
        data = await response.json();
      } catch (e) {}

      return { ok: response.ok, status: response.status, data: data };
    }

    function apiErrorMessage(result) {
      if (result.status === 403) {
        return "沒有權限執行此操作。";
      }
      if (result.status === 400) {
        return "資料格式不正確，請檢查後再試。";
      }
      return "操作失敗（錯誤代碼 " + result.status + "）。";
    }

    // ---------- 新增／修改 ----------
    formEl.addEventListener("submit", async function (event) {
      event.preventDefault();

      const record = {
        record_date: dateEl.value,
        name: nameEl.value.trim(),
        type: typeEl.value,
        amount: Number(amountEl.value)
      };

      if (!record.record_date || !record.name || !(record.amount > 0)) {
        setFormStatus("請填寫日期與名稱，且金額需大於 0。", true);
        return;
      }

      const isEdit = editingId !== null;
      submitBtn.disabled = true;
      setFormStatus("處理中…", false);

      try {
        const result = isEdit
          ? await callApi("PATCH", "?id=eq." + encodeURIComponent(editingId), record)
          : await callApi("POST", "", record);

        if (!result) {
          return;
        }

        if (!result.ok) {
          setFormStatus(apiErrorMessage(result), true);
        } else if (isEdit && (!Array.isArray(result.data) || result.data.length === 0)) {
          setFormStatus("無法修改這筆記錄（只能修改自己的記錄）。", true);
        } else {
          resetForm();
          setFormStatus(isEdit ? "已更新。" : "已新增。", false);
          await loadRecords();
        }
      } catch (e) {
        setFormStatus("無法連線到資料庫，請檢查網路。", true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener("click", function () {
      resetForm();
      setFormStatus("", false);
    });

    // ---------- 刪除 ----------
    async function deleteRow(row) {
      if (!window.confirm("確定要刪除「" + row.name + "」這筆記錄嗎？此動作無法復原。")) {
        return;
      }

      try {
        const result = await callApi("DELETE", "?id=eq." + encodeURIComponent(row.id));

        if (!result) {
          return;
        }

        if (!result.ok) {
          setFormStatus(apiErrorMessage(result), true);
        } else if (!Array.isArray(result.data) || result.data.length === 0) {
          setFormStatus("無法刪除這筆記錄（只能刪除自己的記錄）。", true);
        } else {
          if (editingId === row.id) {
            resetForm();
          }
          setFormStatus("已刪除。", false);
          await loadRecords();
        }
      } catch (e) {
        setFormStatus("無法連線到資料庫，請檢查網路。", true);
      }
    }

    // ---------- 顯示資料 ----------
    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = "status error";
      wrapEl.hidden = true;
    }

    function formatAmount(value) {
      return Number(value).toLocaleString("zh-TW", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function renderRows(rows) {
      bodyEl.textContent = "";

      rows.forEach(function (row) {
        const tr = document.createElement("tr");

        const dateTd = document.createElement("td");
        dateTd.textContent = row.record_date;

        const nameTd = document.createElement("td");
        nameTd.textContent = row.name;

        const typeTd = document.createElement("td");
        typeTd.textContent = TYPE_LABELS[row.type] || row.type;

        const amountTd = document.createElement("td");
        amountTd.className = "num";
        amountTd.textContent = formatAmount(row.amount);

        tr.append(dateTd, nameTd, typeTd, amountTd);

        if (isAdmin) {
          const actionsTd = document.createElement("td");
          actionsTd.className = "row-actions";

          // 管理者只能修改、刪除自己的記錄；別人的記錄僅供查看
          if (row.user_id && row.user_id === myId) {
            const editBtn = document.createElement("button");
            editBtn.type = "button";
            editBtn.className = "row-btn";
            editBtn.textContent = "修改";
            editBtn.addEventListener("click", function () {
              startEdit(row);
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "row-btn danger";
            deleteBtn.textContent = "刪除";
            deleteBtn.addEventListener("click", function () {
              deleteRow(row);
            });

            actionsTd.append(editBtn, deleteBtn);
          }

          tr.appendChild(actionsTd);
        }

        bodyEl.appendChild(tr);
      });
    }

    async function loadRecords() {
      const session = await getValidSession();
      if (!session) {
        goLogin();
        return;
      }

      const claims = decodeToken(session.access_token);
      isAdmin = !!(claims.app_metadata && claims.app_metadata.role === "admin");
      myId = claims.sub || null;

      formEl.hidden = !isAdmin;
      actionsTh.hidden = !isAdmin;
      if (isAdmin && !dateEl.value) {
        dateEl.value = todayString();
      }

      const result = await callApi(
        "GET",
        "?select=id,user_id,record_date,name,type,amount&order=record_date.desc,created_at.desc"
      ).catch(function () {
        return undefined;
      });

      if (result === null) {
        return;
      }

      if (result === undefined) {
        showError("無法連線到資料庫，請檢查網路與設定。");
        return;
      }

      if (!result.ok) {
        showError("讀取資料失敗（錯誤代碼 " + result.status + "）。");
        return;
      }

      const rows = result.data;

      if (!Array.isArray(rows) || rows.length === 0) {
        statusEl.textContent = "目前沒有記錄。";
        statusEl.className = "status";
        wrapEl.hidden = true;
        return;
      }

      renderRows(rows);
      statusEl.textContent = "";
      wrapEl.hidden = false;
    }

    loadRecords();
  </script>
</body>
</html>
