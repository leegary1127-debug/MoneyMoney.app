<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳系統｜簡記理財</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" aria-label="主選單">
    <ul>
      <li><a href="index.html">首頁</a></li>
      <li><a href="record.html" aria-current="page">記帳系統</a></li>
      <li><a href="budget.html">預算管理系統</a></li>
      <li><a href="analysis.html">分析統計</a></li>
    </ul>
  </nav>

  <header class="hero page-title">
    <h1>記帳系統</h1>
  </header>

  <main>
    <p id="status" class="status" role="status">載入中…</p>

    <div class="table-wrap" id="table-wrap" hidden>
      <table class="records">
        <thead>
          <tr>
            <th scope="col">日期</th>
            <th scope="col">名稱</th>
            <th scope="col">類型</th>
            <th scope="col" class="num">金額</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    // 請換成你自己的 Supabase 專案資料（只能使用 anon key，不可放 service_role key）
    const SUPABASE_URL = "https://pugvmbvzzmyrequecdzq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QtxxUQ6FXAftG3uLoHcKhA_JP1rJoMs";

    const TYPE_LABELS = { income: "收入", expense: "支出" };

    const statusEl = document.getElementById("status");
    const wrapEl = document.getElementById("table-wrap");
    const bodyEl = document.getElementById("records-body");

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
      statusEl.hidden = !message;
    }

    function formatAmount(value) {
      return Number(value).toLocaleString("zh-TW", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function renderRecords(records) {
      bodyEl.textContent = "";

      records.forEach(function (record) {
        const tr = document.createElement("tr");

        const cells = [
          record.record_date,
          record.name,
          TYPE_LABELS[record.type] || record.type,
          formatAmount(record.amount)
        ];

        cells.forEach(function (text, index) {
          const td = document.createElement("td");
          td.textContent = text;
          if (index === 3) td.className = "num";
          tr.appendChild(td);
        });

        bodyEl.appendChild(tr);
      });
    }

    async function loadRecords() {
      const url = SUPABASE_URL + "/rest/v1/records" +
        "?select=record_date,name,type,amount" +
        "&order=record_date.desc,created_at.desc";

      try {
        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const records = await response.json();

        if (records.length === 0) {
          showStatus("目前沒有資料。", false);
          return;
        }

        renderRecords(records);
        showStatus("", false);
        wrapEl.hidden = false;
      } catch (error) {
        showStatus("資料載入失敗，請確認 Supabase 設定與網路連線。", true);
      }
    }

    loadRecords();
  </script>
</body>
</html>
