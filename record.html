<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記帳系統｜簡記理財</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" aria-label="主選單">
    <ul>
      <li><a href="index.html">首頁</a></li>
      <li><a href="record.html" aria-current="page">記帳系統</a></li>
      <li><a href="budget.html">預算管理系統</a></li>
      <li><a href="analysis.html">分析統計</a></li>
    </ul>
  </nav>

  <header class="hero page-title">
    <h1>記帳系統</h1>
  </header>

  <main>
    <p id="status" class="status" role="status">載入中…</p>

    <div id="table-wrap" class="table-wrap" hidden>
      <table class="records" aria-label="記帳記錄">
        <thead>
          <tr>
            <th scope="col">日期</th>
            <th scope="col">名稱</th>
            <th scope="col">類型</th>
            <th scope="col" class="num">金額</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    // 請填入你的 Supabase Project URL 與 anon key（不要放 service_role key）
    const SUPABASE_URL = "https://pugvmbvzzmyrequecdzq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QtxxUQ6FXAftG3uLoHcKhA_JP1rJoMs";

    const statusEl = document.getElementById("status");
    const wrapEl = document.getElementById("table-wrap");
    const bodyEl = document.getElementById("records-body");

    const TYPE_LABELS = { income: "收入", expense: "支出" };

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = "status error";
      wrapEl.hidden = true;
    }

    function formatAmount(value) {
      return Number(value).toLocaleString("zh-TW", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function renderRows(rows) {
      bodyEl.textContent = "";

      rows.forEach(function (row) {
        const tr = document.createElement("tr");

        const dateTd = document.createElement("td");
        dateTd.textContent = row.record_date;

        const nameTd = document.createElement("td");
        nameTd.textContent = row.name;

        const typeTd = document.createElement("td");
        typeTd.textContent = TYPE_LABELS[row.type] || row.type;

        const amountTd = document.createElement("td");
        amountTd.className = "num";
        amountTd.textContent = formatAmount(row.amount);

        tr.append(dateTd, nameTd, typeTd, amountTd);
        bodyEl.appendChild(tr);
      });
    }

    async function loadRecords() {
      if (SUPABASE_URL.includes("YOUR-") || SUPABASE_ANON_KEY.includes("YOUR-")) {
        showError("請先在 record.html 填入 Supabase 的 URL 與 anon key。");
        return;
      }

      const url = SUPABASE_URL +
        "/rest/v1/records" +
        "?select=record_date,name,type,amount" +
        "&order=record_date.desc,created_at.desc";

      try {
        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY
          }
        });

        if (!response.ok) {
          showError("讀取資料失敗（錯誤代碼 " + response.status + "）。");
          return;
        }

        const rows = await response.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          statusEl.textContent = "目前沒有記錄。";
          statusEl.className = "status";
          wrapEl.hidden = true;
          return;
        }

        renderRows(rows);
        statusEl.textContent = "";
        wrapEl.hidden = false;
      } catch (e) {
        showError("無法連線到資料庫，請檢查網路與設定。");
      }
    }

    loadRecords();
  </script>
</body>
</html>
