<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分析統計｜簡記理財</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" aria-label="主選單">
    <ul>
      <li><a href="index.html">首頁</a></li>
      <li><a href="record.html">記帳系統</a></li>
      <li><a href="budget.html">預算管理系統</a></li>
      <li><a href="analysis.html" aria-current="page">分析統計</a></li>
      <li class="nav-auth"><a href="login.html" id="auth-link">登入</a></li>
    </ul>
  </nav>

  <header class="hero page-title">
    <h1>分析統計</h1>
  </header>

  <script>
    // 請填入你的 Supabase Project URL 與 anon key（不要放 service_role key）
    const SUPABASE_URL = "https://pugvmbvzzmyrequecdzq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QtxxUQ6FXAftG3uLoHcKhA_JP1rJoMs";
    const SESSION_KEY = "sb_session";

    const authLink = document.getElementById("auth-link");

    function getSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY));
      } catch (e) {
        return null;
      }
    }

    // 已登入時，導覽列的「登入」改成「登出」
    if (getSession()) {
      authLink.textContent = "登出";
      authLink.addEventListener("click", async function (event) {
        event.preventDefault();
        const session = getSession();
        try {
          await fetch(SUPABASE_URL + "/auth/v1/logout?scope=local", {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + session.access_token
            }
          });
        } catch (e) {}
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
        location.href = "login.html";
      });
    }
  </script>
</body>
</html>
