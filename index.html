<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簡記理財｜個人理財系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>簡記理財</h1>
    <p class="tagline">記帳、預算、分析，一個系統全部搞定。</p>
  </header>

  <main>
    <ul class="features">
      <li class="feature">
        <h2>極速記帳</h2>
        <p>幾秒內記下一筆收支，不被繁瑣操作打斷。</p>
      </li>
      <li class="feature">
        <h2>單據自動化</h2>
        <p>單據內容自動整理入帳，省去手動輸入。</p>
      </li>
      <li class="feature">
        <h2>固定收支</h2>
        <p>薪資、房租、訂閱等定期款項，自動按時記錄。</p>
      </li>
      <li class="feature">
        <h2>預算管理</h2>
        <p>設定額度，隨時掌握還能花多少。</p>
      </li>
      <li class="feature">
        <h2>消費分析</h2>
        <p>看清錢花在哪裡，找出可以調整的地方。</p>
      </li>
      <li class="feature">
        <h2>資料備份</h2>
        <p>帳務資料妥善保存，更換裝置也能還原。</p>
      </li>
    </ul>
  </main>

  <script>
    // 之後的 JavaScript 寫在這裡
  </script>
</body>
</html>
