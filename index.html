<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首頁｜簡記理財</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" aria-label="主選單">
    <ul>
      <li><a href="index.html" aria-current="page">首頁</a></li>
      <li><a href="record.html">記帳系統</a></li>
      <li><a href="budget.html">預算管理系統</a></li>
      <li><a href="analysis.html">分析統計</a></li>
      <li class="nav-auth"><a href="login.html" id="auth-link">登入</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>簡記理財</h1>
    <p class="tagline">記帳、預算、分析，一個系統全部搞定。</p>
  </header>

  <main>
    <ul class="features">
      <li class="feature">
        <h2>極速記帳</h2>
        <p>幾秒內記下一筆收支，不被繁瑣操作打斷。</p>
      </li>
      <li class="feature">
        <h2>單據自動化</h2>
        <p>單據內容自動整理入帳，省去手動輸入。</p>
      </li>
      <li class="feature">
        <h2>固定收支</h2>
        <p>薪資、房租、訂閱等定期款項，自動按時記錄。</p>
      </li>
      <li class="feature">
        <h2>預算管理</h2>
        <p>設定額度，隨時掌握還能花多少。</p>
      </li>
      <li class="feature">
        <h2>消費分析</h2>
        <p>看清錢花在哪裡，找出可以調整的地方。</p>
      </li>
      <li class="feature">
        <h2>資料備份</h2>
        <p>帳務資料妥善保存，更換裝置也能還原。</p>
      </li>
    </ul>
  </main>

  <script>
    // 請填入你的 Supabase Project URL 與 anon key（不要放 service_role key）
    const SUPABASE_URL = "https://pugvmbvzzmyrequecdzq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QtxxUQ6FXAftG3uLoHcKhA_JP1rJoMs";
    const SESSION_KEY = "sb_session";

    const authLink = document.getElementById("auth-link");

    function getSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY));
      } catch (e) {
        return null;
      }
    }

    // 已登入時，導覽列的「登入」改成「登出」
    if (getSession()) {
      authLink.textContent = "登出";
      authLink.addEventListener("click", async function (event) {
        event.preventDefault();
        const session = getSession();
        try {
          await fetch(SUPABASE_URL + "/auth/v1/logout?scope=local", {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + session.access_token
            }
          });
        } catch (e) {}
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
        location.href = "login.html";
      });
    }
  </script>
</body>
</html>
